# CONSILIUM thresholds — versioned WITH the models (AGENTS.md §8.3).
# Changing any value here is a model-version change (schema-change skill applies).
version: "0.1.0"

screening_tiers:
  # CLINICAL-REVIEW: PLACEHOLDER cutoffs. Must be chosen on VALIDATION data to
  # meet a stated operating point (e.g. target sensitivity) and signed off by
  # the clinical co-author before any real use. Frozen afterwards.
  intermediate_at: 0.30  # p_calibrated >= this → INTERMEDIATE
  high_at: 0.70          # p_calibrated >= this → HIGH

image_precheck:
  max_bytes: 20000000            # 20 MB upload cap
  allowed_formats: ["PNG", "JPEG"]
  min_resolution_px: 256         # min(width, height) floor — cheap garbage filter

post_inference_quality:
  # CLINICAL-REVIEW: heuristic thresholds on 0..1-normalized RGB; tune on data.
  underexposed_below: 0.12       # mean intensity INSIDE the field of view below → UNDEREXPOSED
  overexposed_above: 0.90        # mean intensity INSIDE the field of view above → OVEREXPOSED
  # Field of view = pixels brighter than fov_pixel_min (the black frame around a
  # fundus photo is excluded). Below fov_min_fraction lit pixels, the whole image
  # is used instead. Set 2026-10-20 (user-approved): measuring the whole frame
  # flagged 7 of 79 sharp research photos UNDEREXPOSED; inside the eye, 2 of 79.
  fov_pixel_min: 0.02
  fov_min_fraction: 0.20
  # Laplacian variance below → BLURRED. 0.0002 → 0.0001 on 2026-10-20
  # (user-approved): over 79 sharp research fundus photos (REFUGE-format,
  # 2124x2056) sharp min = 0.000134; the same photos blurred by 1 px max =
  # 0.000063, 2 px max = 0.000009. 0.0001 passes every sharp photo and stops
  # every blurred copy. One camera/dataset only — re-check on other devices.
  blur_laplacian_var_below: 0.0001
  fundus_red_blue_margin: 0.05   # mean(R)-mean(B) below → NOT_FUNDUS
  min_disc_area_fraction: 0.005  # disc area / image area outside range → DISC_NOT_VISIBLE
  max_disc_area_fraction: 0.30

numeric_tolerances:
  # Deterministic verifier (P7): |claim numeric_value - fact value| must be
  # within tolerance for the claim's numeric_ref fact. Loosening these to pass
  # a test is forbidden (AGENTS.md §26.4).
  default: 0.01            # facts without an explicit per_fact entry
  per_fact:
    cad.cdr.vertical: 0.02
    cad.cdr.area_based: 0.02
    cad.p_glaucoma.calibrated: 0.01

stray_number_whitelist:
  # Deterministic verifier (P7): numerals matching one of these regex classes
  # in prose are NOT stray numbers (SKILLS verifier-check pitfall: dates,
  # follow-up intervals like "2–4 months", ages). Matched case-insensitively.
  date: '\b\d{4}-\d{2}-\d{2}\b|\b\d{1,2}/\d{1,2}/\d{4}\b|\b(?:19|20)\d{2}\b'
  follow_up_interval: '\b\d+\s?(?:–|—|-|to)\s?\d+\s?(?:days?|weeks?|months?|years?)\b|\b\d+\s?(?:days?|weeks?|months?|years?)\b'
  age: '\b\d+\s?-?\s?(?:years?[- ]old|y/?o\b|years? of age)'
  # Disease names that carry a number ("type 2 diabetes", "type 1 DM") — added
  # 2026-10-20 (user-approved) after real notes stopped reports on the "2".
  disease_type: '\btype\s?[12]\s+(?:diabet\w*|DM)\b'

disagreement_topics:
  # Deterministic verifier (P7, §13.1): if sub-reports from different roles
  # mention a topic with opposing stance markers, the draft MUST carry a
  # Disagreement for it. Conservative — may flag for review, never resolves.
  # CLINICAL-REVIEW: topic list and stance markers are a first proposal.
  - topic: escalation urgency
    keywords: ['referr', 'escalat', 'urgent', 'follow-up', 'review']
    stance_a: ['urgent', 'prompt', 'immediate', 'expedited', 'as soon as']
    stance_b: ['routine', 'monitor', 'non-urgent', 'watchful', 'annual', 'defer']
  - topic: cdr interpretation
    keywords: ['cdr', 'cup-to-disc', 'cup/disc', 'cupping']
    stance_a: ['suspicious', 'enlarged', 'abnormal', 'concerning', 'elevated']
    stance_b: ['normal', 'physiological', 'unremarkable', 'within normal']
