# Dev-stack Prometheus: scrapes the API's /metrics and loads the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: consilium-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: consilium-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
  # The app run on the host with scripts/run_app.py (API + worker in ONE
  # process, so :8000/metrics carries the pipeline metrics too). Shows DOWN
  # when you use the compose api/worker instead — that is expected.
  - job_name: consilium-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
