# Dev-stack Prometheus: scrapes the API's /metrics and loads the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: consilium-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: consilium-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
