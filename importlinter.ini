# Import boundary contracts — ARCHITECTURE.md §4.2 / AGENTS.md §5.
# Checked by `make imports` (lint-imports) and blocking in CI.
# When Phase 3 adds llm/client_openai.py, add `ignore_imports = consilium.llm.* -> openai.*`
# to the openai contract; when Phase 9 adds persistence code, add the equivalent
# sqlalchemy/alembic ignores to the db contract.

[importlinter]
root_package = consilium
include_external_packages = True

# ---------------------------------------------------------------------------
# schemas imports nothing internal; everything else may import schemas.
# ---------------------------------------------------------------------------
[importlinter:contract:schemas-independent]
name = schemas/ imports nothing from the rest of the package (AGENTS.md §5)
type = forbidden
source_modules =
    consilium.schemas
forbidden_modules =
    consilium.api
    consilium.core
    consilium.vision
    consilium.intake
    consilium.context
    consilium.llm
    consilium.agents
    consilium.verify
    consilium.guardrails
    consilium.graph
    consilium.persistence
    consilium.review
    consilium.jobs
    consilium.eval
    consilium.observability

# ---------------------------------------------------------------------------
# vision/ is CAD machinery: no LLM, no agents, no orchestration.
# ---------------------------------------------------------------------------
[importlinter:contract:vision-isolated]
name = vision/ must not import llm/, agents/, graph/, or intake/ (AGENTS.md §5)
type = forbidden
source_modules =
    consilium.vision
forbidden_modules =
    consilium.llm
    consilium.agents
    consilium.graph
    consilium.intake

# ---------------------------------------------------------------------------
# intake/ uses llm/ for extraction; never agents/ or context/ (AGENTS.md §5).
# ---------------------------------------------------------------------------
[importlinter:contract:intake-boundary]
name = intake/ must not import agents/, context/, vision/, or graph/
type = forbidden
source_modules =
    consilium.intake
forbidden_modules =
    consilium.agents
    consilium.context
    consilium.vision
    consilium.graph

# ---------------------------------------------------------------------------
# context/ is deterministic code: facts, builder, router. No LLM, no vision.
# ---------------------------------------------------------------------------
[importlinter:contract:context-deterministic]
name = context/ must not import llm/, vision/, agents/, or graph/ (I-2)
type = forbidden
source_modules =
    consilium.context
forbidden_modules =
    consilium.llm
    consilium.vision
    consilium.agents
    consilium.graph

# ---------------------------------------------------------------------------
# agents/ receive facts, never CAD machinery (AGENTS.md §5, I-1).
# ---------------------------------------------------------------------------
[importlinter:contract:agents-no-cad]
name = agents/ must not import vision/ (agents receive facts, never CAD machinery)
type = forbidden
source_modules =
    consilium.agents
forbidden_modules =
    consilium.vision

# ---------------------------------------------------------------------------
# Only llm/ touches the OpenAI SDK (AGENTS.md §5).
# ---------------------------------------------------------------------------
[importlinter:contract:openai-only-in-llm]
name = only llm/ may import the openai SDK
type = forbidden
source_modules =
    consilium
forbidden_modules =
    openai

# ---------------------------------------------------------------------------
# Only persistence/ touches the database (AGENTS.md §5).
# ---------------------------------------------------------------------------
[importlinter:contract:db-only-in-persistence]
name = only persistence/ may import sqlalchemy/alembic
type = forbidden
source_modules =
    consilium
forbidden_modules =
    sqlalchemy
    alembic
