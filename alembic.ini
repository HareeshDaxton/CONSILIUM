[alembic]
script_location = src/consilium/persistence/alembic
prepend_sys_path = .
path_separator = os
# DATABASE_URL env var wins; this is only a fallback for local dev.
sqlalchemy.url = postgresql+asyncpg://consilium:consilium@localhost:5432/consilium

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
