# CONSILIUM local stack (ARCHITECTURE.md §14, dev topology).
# Services: api, worker, frontend, postgres, minio (+ bucket init), fake-vision.
# Langfuse self-host is OPTIONAL and heavyweight (ClickHouse + Redis + blob —
# check current docs, AGENTS.md §18); a commented profile block is at the bottom.
# The frontend is the React review SPA (Vite dev server proxying /v1 to the api);
# no pipeline or status logic ever runs in it.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consilium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consilium}
      POSTGRES_DB: ${POSTGRES_DB:-consilium}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    # Docker Hub's minio/minio is no longer published (MinIO changed community
    # distribution); bitnamilegacy/minio is the same server, dev-only use.
    image: bitnamilegacy/minio:latest
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-consilium}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-consilium-dev-only}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-consilium}
    volumes:
      - miniodata:/bitnami/minio/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  fake-vision:
    build: .
    command: ["python", "scripts/fake_vision_server.py"]
    environment:
      FAKE_VISION_REVISION: ${FAKE_VISION_REVISION:-}  # empty = configs/models.yaml pin
    ports:
      - "8100:8100"

  api:
    build: .
    command: ["uvicorn", "consilium.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://consilium:consilium@postgres:5432/consilium}
      # V1 object store binding: file:// on a volume shared by api + worker
      # (s3:// is a deployment seam not implemented in V1 — fails closed).
      OBJECT_STORE_URI: ${OBJECT_STORE_URI:-file:///data/objects}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY (32-byte urlsafe-b64)}
      RAILS_ENGINE: ${RAILS_ENGINE:-passthrough}
      VISION_CLIENT_MODE: ${VISION_CLIENT_MODE:-http}
      VISION_ENDPOINT_URL: ${VISION_ENDPOINT_URL:-http://fake-vision:8100}
      VISION_ENDPOINT_TOKEN: ${VISION_ENDPOINT_TOKEN:-dev-fake-token}
      VISION_PINNED_REVISION: ${VISION_PINNED_REVISION:-hf:pamixsun/swinv2_tiny_for_glaucoma_classification@a25a03d9ff23+hf:pamixsun/segformer_for_optic_disc_cup_segmentation@a0463fb6c2bf}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      # Google sign-in for the review UI (off when GOOGLE_CLIENT_ID is empty)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLINICIANS: ${GOOGLE_CLINICIANS:-}
      GOOGLE_SUBMITTERS: ${GOOGLE_SUBMITTERS:-}
    volumes:
      - objects:/data/objects
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fake-vision:
        condition: service_started

  worker:
    build: .
    volumes:
      - objects:/data/objects
    command: ["python", "-m", "consilium.jobs.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://consilium:consilium@postgres:5432/consilium}
      # V1 object store binding: file:// on a volume shared by api + worker
      # (s3:// is a deployment seam not implemented in V1 — fails closed).
      OBJECT_STORE_URI: ${OBJECT_STORE_URI:-file:///data/objects}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY (32-byte urlsafe-b64)}
      RAILS_ENGINE: ${RAILS_ENGINE:-passthrough}
      VISION_CLIENT_MODE: ${VISION_CLIENT_MODE:-http}
      VISION_ENDPOINT_URL: ${VISION_ENDPOINT_URL:-http://fake-vision:8100}
      VISION_ENDPOINT_TOKEN: ${VISION_ENDPOINT_TOKEN:-dev-fake-token}
      VISION_PINNED_REVISION: ${VISION_PINNED_REVISION:-hf:pamixsun/swinv2_tiny_for_glaucoma_classification@a25a03d9ff23+hf:pamixsun/segformer_for_optic_disc_cup_segmentation@a0463fb6c2bf}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      fake-vision:
        condition: service_started

  frontend:
    # Dev topology (ARCHITECTURE.md §5.1): Vite dev server; /v1 is proxied to
    # the api service so the browser talks to one origin (no CORS surface).
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

  # ---------------------------------------------------------------------
  # OPTIONAL: Langfuse self-host (LLM observability, AGENTS.md §18).
  # Recent Langfuse versions need ClickHouse + Redis + blob storage beside
  # Postgres — check the current self-hosting docs before enabling.
  # Cloud Langfuse is acceptable for dev with SYNTHETIC data only.
  #
  # langfuse:
  #   profiles: ["langfuse"]
  #   image: langfuse/langfuse:latest
  #   depends_on: [postgres]
  #   environment: ...
  #   ports: ["3000:3000"]
  # ---------------------------------------------------------------------

volumes:
  frontend_node_modules:
  pgdata:
  miniodata:
  objects:
